i={pre0:[[0,"A hundred years ago, one called the Bannerbearer sealed away the Abyss. And now, that seal has begun to fray."],["gren","Hey, you're awake! There's a black sprout in the middle of the mire. Smash it, and the meadow will come back."],["gren","Bannerbearer or not, I don't care. Give the orders. We'll follow you!"]],post0:[["shizuku","The mire is... receding. The grass is turning green again."],["gren","We did it! Did you see how our squads moved? I've never fought like that before."],["shizuku","Gren, look. The banner this person is holding... the crest is glowing."],["jin","An old war banner. Torn, but well made. Whose army did it belong to?"],["shizuku","It looks like the banner of the legendary Bannerbearer. From a hundred years ago."],["jin","That's a fairy tale. ...But I did see the troops fall into formation on their own during the fight."],["jin","This was inside the sprout. A black stone. It's still pulsing."],["shizuku","A shard of the Abyss Core... I read about them in an old book. They scatter when the seal cracks."],["jin","Then this isn't the only shard. The volcano to the south, the ice castle to the north, the Thunder Tower to the east. Black clouds hang over all of them."],["gren","Then we smash every one. The volcano's next. That's the Flame Kingdom... Her Majesty Carmia's land."],["shizuku","They say Her Majesty dislikes outsiders. Even if we show her the banner, she may not believe us."],[0,"Little by little, soldiers began to gather around the youth who raised the banner."]],pre1:[["vulca","Halt. Beyond this point lies the Flame Kingdom."],["gren","Y-Your Majesty Carmia...!"],["vulca","That torn banner. You think you're the Bannerbearer? A whelp who merely picked up a flag, claiming the name of a hero from a century ago."],["shizuku","Your Majesty, this person stopped the mire in the meadow. We saw it with our own eyes."],["vulca","With one sprout in a meadow? Look at the mountain's guardian. The Lava Giant has been swallowed by the mire, and not even my army can get near it."],["jin","Then why stop us? Sounds like you need the help."],["vulca","...What a mouthy spearman."],["vulca","Very well. If your legion can bring down that giant, I'll acknowledge you, a little. If you fall, the banner is mine."]],post1:[["vulca","...Splendid."],["vulca","Every soldier moved with their eyes on your banner. Without a single command, like one living creature."],["vulca","My grandmother told me the Bannerbearer of old was the same. A banner is no ornament. It is the heart of the legion."],["gren","Then, Your Majesty, you'll come with us...!"],["vulca","I'll lend you my sword. Don't get the wrong idea. It's a loan. Once every shard is shattered, I want it back."],["jin","Not one for honesty, this empress."],["vulca","I can hear you, spearman."],[0,"The Flame Empress joined the ranks beneath the banner."]],pre2:[["setsuna","...So you are the Bannerbearer."],["shizuku","You're... the swordswoman of the Ice Kingdom? Have you been waiting outside the castle all this time?"],["setsuna","Three days. The castle gate is frozen shut. I couldn't open it alone."],["setsuna","I have a request. The queen of that castle is my sister."],["setsuna","The mire seeped into her heart, and now she is freezing the whole kingdom. The people, the birds, even time itself."],["gren","So you want us to... defeat your sister?"],["setsuna","I want you to stop her. She is still weeping deep inside that ice. I can hear it."],["vulca","How naive. I've never heard of anyone swallowed by the mire coming back."],["setsuna","Even so. ...Bannerbearer, I feel your legion could break through her ice."]],post2:[["setsuna","Sister!"],["shizuku","She's all right, she's breathing. Just asleep. The mire is gone, all of it."],["setsuna","Her ice... melted. It really melted."],["vulca","...So they can come back. Even after the mire takes them."],["setsuna","Thank you, Bannerbearer. From this day on, this sword belongs to your squads."],["jin","That's the third shard. And they keep getting bigger. We must be closing in on the Core."],["shizuku","Only the Thunder Tower remains. Legend says that's where the seal was made a hundred years ago."],[0,"A spring breeze returned to the Ice Kingdom."]],pre3:[["zex","I have been waiting, Bannerbearer. The thunder told me you would come."],["vulca","Iris. So you've been shut away in this tower all along."],["zex","This is the keystone of the seal. A hundred years ago, six rulers and the Bannerbearer closed the mouth of the Abyss with this tower."],["zex","The tower's colossus was built to guard the seal. But now the mire controls it, and it is trying to break the seal itself."],["setsuna","If we defeat the colossus, the seal will..."],["zex","Come undone, for a moment. And the path to the Abyss will open. Beyond it lies the Core itself."],["zex","The deeper you descend, the thicker the mire and the stronger the foes. Are you ready to go on even so?"],["gren","We can't turn back after coming this far! Right, Bannerbearer?"],["jin","...Well, heading home now wouldn't look very good."]],post3:[["zex","The colossus has fallen... A path to the Abyss has opened beneath the tower."],["vulca","Look. The eastern sky, the western sky. I can see banners."],[0,"Princess Lucia's fleet of the Azure Sea. King Sieg's storm cavalry. Princess Liefe's people of the forest."],["vulca","Lucia, Sieg, and Liefe have all come. Six kingdoms, united once more beneath a single banner."],["zex","The Abyss has no bottom. But the deeper we go, the weaker the Core grows. Either we run out of strength, or it does."],["setsuna","So that no one else ends up like my sister."],["shizuku","As long as we're together, I know we'll be all right."],["gren","We'll go as far as it takes. Bannerbearer, give the command!"],[0,"And so the Bannerbearer and the six legions descended into the depths of the Abyss."],[0,"Depth unlocked. The deeper you go, the greater the rewards."]]},qi={pre0:"Prologue: The One Who Took Up the Ban     <b style="--c:#7dff9a">Upgrade</b><span>Defeating foes fills a gauge for a choice of 3 upgrades. The game pauses at most once every ${Bo}s; extra picks are chosen back to back.</span>
    <b style="--c:#fff6c8">Light Seeds</b><span>Dropped by elites and chests. Picking one up adds +1 ally to your smallest squad. Wiped squads return and fallen Captains revive (when full, 1 moves over from a larger squad; with no wiped squad, it promotes instead). Colored seeds that appear during shields add to that color. Squad sizes are shown at top left.</span>
    <b style="--c:#ffd25a">Skills & Traits</b><span>Captains have a Skill (a small move used automatically every few seconds), an Ultimate (button), and Traits (two always-on effects). Getting the same Captain again (Awaken) strengthens their unique effects.</span>
    <b style="--c:#7fe8ff">Lieutenant</b><span>Each squad can also take 1 Lieutenant besides its Captain (Squads → tap a Captain → Lieutenant). Lieutenants have no Skill or Ultimate; their Traits and role work at half strength, and they count toward Nation and Pair Bonds.</span>
    <b style="--c:#ff9ad0">Nation & Pair Bonds</b><span>Field 2+ Captains/Lieutenants from the same nation for a Nation Bond, or a specific pair for a Pair Bond. Active bonds show at the bottom of the Squads screen. They only affect battle; there's no reward for collecting them.</span>
    <b style="--c:#c9a0ff">Captain Roles</b><span>Every Captain has a role. Offense = everyone's ATK +8% · Defense = damage taken -12% · Healing = everyone heals 3% every 5s · Support = Ultimate charge +12% · Control = foes and bosses 10% slower. Roles work while the Captain is alive, and two of the same role stack. The effect is the same at any rarity.</span>
    <b style="--c:#ffd25a">Captain</b><span>Recruit them, then bring one per squad. Tap their portrait on the right to use their Ultimate. The number is seconds until it's ready.</span>
    <b style="--c:#ffc83d">Lingering Effects</b><span>Last a while after an Ultimate. Blaze = ATK ↑ · Water Ward = damage taken ↓ and healing · Charged = attack speed ↑ · Tailwind = pushes foes away · Frost Field = slows · Regen = healing. R 4s · SR 6s · SSR 9s.</span>
    <b style="--c:#ff8a5a">Items</b><span>Bottom left. Dropped by elites and bosses. Blast Bomb = blows up everything nearby · Holy Shield = 4s of invincibility. Anyone can use them, regardless of Captains.</span>
    <b style="--c:#ffd25a">Boss Rush</b><span>BOSS on the Sortie screen. Unlocks after Chapter 1. Bosses come one after another; each one you beat heals you, adds allies, and gives a choice of 3 upgrades. The Weekly Rule (resisted and weak elements) changes every Monday.</span>
    <b style="--c:#d8a0ff">Secret Boss: Abyss King</b><span>From the Boss Rush screen. Unlocks after Chapter 4. Its Veil of Dark blocks almost all attacks. Before each Roar, a circle of light appears (a gold arrow if it's off screen). Get 80%+ of your allies inside for 10s of Light's Blessing, when attacks land. Outside the circle you take heavy damage. After 270s, Abyssal Doom wipes you out. You can't win on auto alone.</span>
    <b style="--c:#ff9ad0">Event</b><span>EVENT at the top right of Home. Every 2 weeks the featured characters change, with a special stage where those two join as trial Captains, plus a short story. Wins earn Tokens to trade at the exchange for Crystals, Upgrade Pts, Badges, or the featured SR (they expire when the event ends).</span>
    <b style="--c:#ffd25a">Featured Recruit</b><span>The featured SSR and SR change every 2 weeks. New Captains join the pool once they're featured.</span>
    <b style="--c:#ffb347">Boss Rush Ranks</b><span>Your best run each month sets your rank (Bronze 3 · Silver 6 · Gold 10 · Abyss 15 bosses). When the month changes, you get Crystals and a title for your rank. The Abyss King's shield colors and Roar timing also change monthly.</span>
    <b style="--c:#7fe8ff">Quests</b><span>Top right of Home. 3 dailies (reset at midnight JST) and 3 weeklies (reset Mondays JST). They progress when a battle or Boss Rush ends, and reward Crystals and Badges.</span>
  </div>
