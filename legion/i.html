<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../style.css">
<title>エレメントレギオン 招待</title>
<style>.code{font-size:32px;font-weight:700;letter-spacing:.12em;margin:8px 0 20px;user-select:all;-webkit-user-select:all}.go{display:block;width:100%;box-sizing:border-box;padding:16px;border:0;border-radius:12px;background:#0a84ff;color:#fff;font-size:18px;font-weight:700;font-family:inherit}</style>
</head>
<body>
<main>
<div class="app"><img src="icon.png" alt=""><div><b>エレメントレギオン</b><span>招待</span></div></div>
<p>招待コード</p>
<div class="code" id="c">-</div>
<button class="go" id="go">コピーして App Store へ</button>
<p>アプリの「遊び方」→ 招待 に貼り付けると晶石800(始めて7日以内)。</p>
</main>
<script>
const c=(new URLSearchParams(location.search).get('c')||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,8);
document.getElementById('c').textContent=c||'-';
document.getElementById('go').onclick=async()=>{try{if(c)await navigator.clipboard.writeText(c)}catch(e){}location.href='https://apps.apple.com/jp/app/id6832966034'};
</script>
</body>
</html>
